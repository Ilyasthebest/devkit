    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DevKit",
        "url": "https://devkit-mu-one.vercel.app/",
        "description": "DevKit is a fast, private browser-based developer toolkit with 18 developer utilities for formatting, encoding, debugging, conversion, testing, and reference tasks.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('devkit_theme');
          var isDark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main style="max-width: 64rem; margin: 0 auto; padding: 2rem 1.5rem; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

          DevKit — Fast Private Developer Tools
        </h1>
        <p style="font-size: 1.125rem; line-height: 1.75rem; color: #52525b; margin: 0 0 1rem 0;">
          Fast, private browser-based utilities for formatting, encoding, debugging, conversion, testing, and reference tasks.
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
